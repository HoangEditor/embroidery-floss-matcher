<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Embroidery Floss Matcher</title>
<meta name="description" content="Find matching embroidery floss colors across DMC, Anchor, Cosmo, J&amp;P Coats. 456 colors with RGB hex codes.">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d14;--card:#151822;--border:#252940;--text:#e8eaed;--t2:#8b8fa7;--a:#6366f1}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%,rgba(99,102,241,.12),transparent),radial-gradient(ellipse 60% 40% at 80% 80%,rgba(168,85,247,.08),transparent);pointer-events:none;z-index:0}
.app{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:40px 20px}
.hero{text-align:center;padding:60px 0 40px;animation:fadeUp .8s}
.hero h1{font-size:2.8rem;font-weight:800;letter-spacing:-1px;background:linear-gradient(135deg,#fff 30%,#a5b4fc 70%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hero p{font-size:1.1rem;color:var(--t2);margin-top:12px}
.sbox{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:6px;display:flex;gap:8px;max-width:520px;margin:0 auto 24px;box-shadow:0 8px 40px rgba(0,0,0,.4);animation:fadeUp .8s .15s both}
.sbox:focus-within{border-color:var(--a);box-shadow:0 8px 40px rgba(99,102,241,.2)}
.sbox input{flex:1;background:none;border:none;outline:none;font-size:1.1rem;color:var(--text);padding:14px 16px;font-family:inherit}
.sbox input::placeholder{color:var(--t2)}
.sbox button{background:var(--a);color:#fff;border:none;border-radius:10px;padding:14px 24px;font-size:1rem;font-weight:600;cursor:pointer}
.sbox button:hover{background:#5558e6}
.btabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:32px;animation:fadeUp .8s .25s both}
.btab{padding:8px 18px;border-radius:99px;border:1px solid var(--border);background:var(--card);color:var(--t2);cursor:pointer;font-size:.88rem;font-weight:500;transition:all .25s}
.btab:hover{border-color:var(--a);color:var(--text)}
.btab.active{background:var(--a);border-color:var(--a);color:#fff}
.result{animation:fadeUp .5s;display:none}
.result.on{display:block}
.ch{display:flex;gap:24px;align-items:center;padding:28px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:20px;transition:transform .3s,box-shadow .3s}
.ch:hover{transform:translateY(-2px);box-shadow:0 12px 40px rgba(0,0,0,.3)}
.csw{width:100px;height:100px;border-radius:10px;flex-shrink:0;box-shadow:0 8px 30px rgba(0,0,0,.5);transition:transform .3s}
.ch:hover .csw{transform:scale(1.05)}
.cinfo .code{font-size:2.5rem;font-weight:800;letter-spacing:-1px}
.cinfo .name{color:var(--t2);font-size:1rem}
.cinfo .hex{font-family:monospace;color:var(--t2)}
.conv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.cc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;display:flex;align-items:center;gap:12px;transition:all .25s;animation:fadeUp .4s both}
.cc:hover{border-color:var(--a);transform:translateY(-2px)}
.ccsw{width:40px;height:40px;border-radius:8px}
.ccb{font-size:.75rem;color:var(--a);font-weight:600;text-transform:uppercase}
.cccode{font-size:1.1rem;font-weight:700}
.sug{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.sc{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;display:flex;align-items:center;gap:10px;transition:all .2s;animation:fadeUp .3s both}
.sc:hover{border-color:var(--a);transform:translateY(-2px)}
.scsw{width:32px;height:32px;border-radius:6px}
.sccode{font-weight:700;font-size:.95rem}
.scname{font-size:.7rem;color:var(--t2)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:4px;margin-top:16px}
.gs{aspect-ratio:1;border-radius:6px;cursor:pointer;transition:transform .2s;position:relative}
.gs:hover{transform:scale(1.2);z-index:2;box-shadow:0 6px 20px rgba(0,0,0,.5)}
.gs span{position:absolute;bottom:2px;left:4px;font-size:.55rem;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.foot{text-align:center;padding:40px 0;color:var(--t2);font-size:.82rem}
.spin{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--a);border-radius:50%;animation:sp .6s linear infinite;margin:0 auto 12px}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:600px){.hero h1{font-size:2rem}.ch{flex-direction:column;text-align:center}.csw{width:80px;height:80px}.conv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="hero"><h1>Embroidery Floss Matcher</h1><p>Find matching thread colors across DMC, Anchor, Cosmo &amp; J&amp;P Coats.</p></header>
<div class="sbox"><input id="q" placeholder="Enter DMC code (e.g. 310, 666, 995)..." autofocus onkeydown="if(event.key==='Enter')s()"><button onclick="s()">Match</button></div>
<div class="btabs"><div class="btab active" onclick="f('all',this)">All Brands</div><div class="btab" onclick="f('anchor',this)">Anchor</div><div class="btab" onclick="f('cosmo',this)">Cosmo</div><div class="btab" onclick="f('jp_coats',this)">J&amp;P Coats</div></div>
<div id="load" style="text-align:center;padding:40px;display:none"><div class="spin"></div></div>
<div class="result" id="r"></div>
<div style="text-align:center;margin-top:40px"><button class="btab" onclick="g()" style="padding:10px 24px">All 456 Colors</button></div>
<div class="cgrid" id="grid" style="display:none"></div>
<footer class="foot"><p>456 DMC colors &bull; 449 Cosmo matches &bull; 107 Anchor matches</p></footer>
</div>
<script>
let cur=null,all=[],brand='all';
async function s(){
let q=document.getElementById('q').value.trim();if(!q)return;
let l=document.getElementById('load'),r=document.getElementById('r');
l.style.display='block';r.classList.remove('on');r.innerHTML='';
try{
let resp=await fetch('/api/search?q='+encodeURIComponent(q));
let d=await resp.json();l.style.display='none';
if(d.found){cur=d.color;render(d.color)}
else if(d.suggestions&&d.suggestions.length){
r.innerHTML='<h3 style="margin-bottom:16px">Did you mean...</h3><div class="sug">'+d.suggestions.map((c,i)=>'<div class="sc" style="animation-delay:'+(i*.04)+'s" onclick="pick(''+c.code+'')"><div class="scsw" style="background:'+c.hex+'"></div><div><div class="sccode">'+c.code+'</div><div class="scname">'+c.name+'</div></div></div>').join('')+'</div>';
r.classList.add('on')
}else{r.innerHTML='<div style="text-align:center;padding:40px;color:var(--t2)">No colors found</div>';r.classList.add('on')}
}catch(e){l.style.display='none';r.innerHTML='<div style="text-align:center;padding:40px;color:#ef4444">Error</div>';r.classList.add('on')}
}
function render(c){
let conv=[];
if(c.anchor)conv.push({b:'Anchor',code:c.anchor});
if(c.cosmo)conv.push({b:'Cosmo',code:c.cosmo});
if(c.jp_coats)conv.push({b:'J&P Coats',code:c.jp_coats});
if(brand!=='all')conv=conv.filter(function(x){return x.b.toLowerCase().replace(/[ &]/g,'_')===brand});
let h=conv.map(function(x,i){return'<div class="cc" style="animation-delay:'+(.1+i*.08)+'s"><div class="ccsw" style="background:'+c.hex+'"></div><div><div class="ccb">'+x.b+'</div><div class="cccode">#'+x.code+'</div></div></div>'}).join('')||'<div style="grid-column:1/-1;text-align:center;padding:20px;color:var(--t2)">No equivalents found</div>';
document.getElementById('r').innerHTML='<div class="ch"><div class="csw" style="background:'+c.hex+'"></div><div class="cinfo"><div class="code">DMC '+c.code+'</div><div class="name">'+c.name+'</div><div class="hex">'+c.hex+'</div></div></div><div class="conv">'+h+'</div>';
document.getElementById('r').classList.add('on');
document.getElementById('r').scrollIntoView({behavior:'smooth',block:'center'});
}
async function pick(code){document.getElementById('q').value=code;let r=await fetch('/api/color/'+code);let d=await r.json();if(d.found){cur=d.color;render(d.color)}}
function f(b,el){brand=b;document.querySelectorAll('.btab').forEach(function(t){t.classList.remove('active')});el.classList.add('active');if(cur)render(cur)}
async function g(){
let gd=document.getElementById('grid');
if(gd.style.display==='grid'){gd.style.display='none';return}
if(!all.length){gd.innerHTML='<div style="text-align:center;padding:40px"><div class="spin"></div></div>';gd.style.display='grid';
let r=await fetch('/api/all?limit=500');let d=await r.json();all=d.colors}
gd.innerHTML=all.map(function(c){return'<div class="gs" style="background:'+c.hex+'" onclick="pick(''+c.code+'')"><span>'+c.code+'</span></div>'}).join('');
gd.style.display='grid';gd.scrollIntoView({behavior:'smooth'});
}
</script>
</body>
</html>
